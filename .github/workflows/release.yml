name: Release

# Runs once a week (Tuesday 06:00 UTC) and on manual dispatch. Nothing else triggers it.
# A scheduled run releases only when main moved since the last release, bumping the patch
# version; for a minor/major bump raise M.VERSION in src/lua/intf/modules/hushbreak_core.lua
# in a PR (the next release uses it as-is), or dispatch with an explicit version.
# One run: stamp version + CHANGELOG, lint + test, pack the zip, commit + tag on main,
# create the GitHub Release with the zip attached.
on:
  schedule:
    - cron: "0 6 * * 2"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 1.2.0). Empty = next patch version."
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Decide whether and what to release
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          CURRENT=$(sed -n 's/^M\.VERSION[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' src/lua/intf/modules/hushbreak_core.lua)
          LAST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
          echo "source version: $CURRENT; last release tag: ${LAST_TAG:-none}"

          if [ -n "$LAST_TAG" ] && [ "$(git rev-parse "$LAST_TAG^{commit}")" = "$(git rev-parse HEAD)" ]; then
            echo "main is exactly $LAST_TAG - nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          REQUESTED='${{ inputs.version }}'
          if [ -n "$REQUESTED" ]; then
            V="$REQUESTED"
          elif git rev-parse -q --verify "refs/tags/v$CURRENT" >/dev/null; then
            # The source version is already out: next patch.
            IFS=. read -r MA MI PA <<< "$CURRENT"
            V="$MA.$MI.$((PA + 1))"
          else
            # The sources carry a version nobody released yet (first release, or a bump made
            # in a PR): release exactly that.
            V="$CURRENT"
          fi

          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "'$V' is not a plain x.y.z version"; exit 1; fi
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then echo "tag v$V already exists"; exit 1; fi
          HIGHEST=$(printf '%s\n%s\n' "$CURRENT" "$V" | sort -V | tail -1)
          if [ "$HIGHEST" != "$V" ]; then echo "$V is below the source version $CURRENT"; exit 1; fi

          echo "releasing $V"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Require the HUSHBREAK_RELEASE_TOKEN secret
        if: steps.decide.outputs.should_release == 'true'
        env:
          HAS_TOKEN: ${{ secrets.HUSHBREAK_RELEASE_TOKEN != '' }}
        shell: bash
        run: |
          # main only accepts changes through pull requests; the release commit is pushed with
          # a maintainer token that bypasses that rule. See DEVGUIDE.md -> Release process.
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Repository secret HUSHBREAK_RELEASE_TOKEN is missing - the release push to main would be rejected."
            exit 1
          fi

      - name: Verify CI on main is green
        if: steps.decide.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Look at the CI run of the exact commit being released, not "the latest completed
          # run on main": after quick successive merges that one may be a superseded, cancelled
          # run. Wait while the run for HEAD is still going (up to 20 minutes).
          SHA=$(git rev-parse HEAD)
          for attempt in $(seq 1 40); do
            RUN=$(gh run list -w ci.yml -c "$SHA" -L 1 --json status,conclusion -q '.[0] | "\(.status)/\(.conclusion)"' 2>/dev/null || echo "")
            case "$RUN" in
              "") echo "No CI run for $SHA - allowing release through."; exit 0 ;;
              completed/success) echo "CI for $SHA is success."; exit 0 ;;
              completed/*) echo "CI for $SHA ended as '${RUN#completed/}'. Refusing to release."; exit 1 ;;
              *) echo "CI for $SHA is $RUN - waiting..."; sleep 30 ;;
            esac
          done
          echo "CI for $SHA did not finish in time. Refusing to release."
          exit 1

  release:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # Pushed as the maintainer (fine-grained PAT, repository admin): the only actor that
          # may bypass the pull-request rule on main. GITHUB_TOKEN cannot on a user-owned repo.
          token: ${{ secrets.HUSHBREAK_RELEASE_TOKEN }}

      - name: Install Lua 5.1 and luacheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 lua-check

      - name: Stamp version and changelog
        shell: pwsh
        run: |
          ./scripts/set-version.ps1 -Version $env:VERSION
          # An empty "Unreleased" section falls back to the commit subjects since the last tag.
          ./scripts/cut-changelog.ps1 -Version $env:VERSION -FallbackFromGit | Out-Null
          Get-Content dist/release-notes.md

      - name: Lint + test the stamped sources
        shell: pwsh
        run: |
          ./scripts/lint.ps1
          ./scripts/test.ps1

      - name: Pack
        id: pack
        shell: pwsh
        run: |
          $r = ./scripts/pack.ps1 | Select-Object -Last 1
          "zip=$($r.Zip)" >> $env:GITHUB_OUTPUT
          "hash=$($r.Sha256)" >> $env:GITHUB_OUTPUT

      - name: Commit, tag and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lua/intf/modules/hushbreak_core.lua src/lua/extensions/hushbreak_calibrate.lua CHANGELOG.md
          git commit -m "chore: release v$VERSION"
          git tag -a "v$VERSION" -m "Hushbreak v$VERSION"
          git push origin main "v$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            cat dist/release-notes.md
            echo
            echo "SHA256 \`Hushbreak-$VERSION.zip\`: \`${{ steps.pack.outputs.hash }}\`"
          } > dist/release-body.md
          gh release create "v$VERSION" \
            --title "Hushbreak v$VERSION" \
            --notes-file dist/release-body.md \
            "dist/Hushbreak-$VERSION.zip"
